---
- name: Installation traefik
  hosts: matrix-app-01
  become: true
  vars_files: ./vars/credentials.yaml

  tasks:
    - name: Update packete und quellen
      become: true
      ansible.builtin.apt:
        update_cache: true
        upgrade: safe

    - name: Entfernen von Caddy.
      become: true
      block:
        - name: Stopp Caddy.
          ansible.builtin.systemd_service:
            name: caddy
            state: stopped
            enabled: false

        - name: Backup Caddy
          community.general.archive:
            dest: /root/caddy.gz
            format: gz
            path: /etc/caddy/Caddyfile
            mode: "0600"
            owner: root
            group: root

        - name: Caddy Deinstallieren
          ansible.builtin.apt:
            name:
              - caddy
              - nginx
            state: absent

    - name: Traefik
      block:
        - name: traefik grupe anlegen
          ansible.builtin.group:
            name: traefik
            system: true

        - name: traefik benuter anlegen
          ansible.builtin.user:
            name: traefik
            group: traefik
            system: true
            shell: /usr/sbin/nologin
            create_home: false

        - name: Traefik Verzeichnis anlegen
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: directory
            owner: "{{ item.owner }}"
            group: "{{ item.group }}"
            mode: "{{ item.mode }}"
          loop:
            - path: /etc/traefik
              owner: root
              group: traefik
              mode: "0750"

            - path: /etc/traefik/dynamic
              owner: root
              group: traefik
              mode: "0750"

            - path: /var/lib/traefik
              owner: traefik
              group: traefik
              mode: "0750"
    - name: Traefik Downloaden
      ansible.builtin.get_url:
        url: https://github.com/traefik/traefik/releases/download/v3.7.10/traefik_v3.7.10_linux_amd64.tar.gz
        dest: /tmp/traefik.tat.gz
        mode: "0644"
    - name: Traefik Entpacken
      ansible.builtin.unarchive:
        src: /tmp/traefik.tat.gz
        dest: /tmp
        remote_src: true
    - name: Traefik Binry instalieren
      ansible.builtin.copy:
        remote_src: true
        src: /tmp/traefik
        dest: /usr/local/bin/traefik
        owner: root
        group: root
        mode: "0755"
    - name: Traefik Version prüfen
      ansible.builtin.command:
        argv:
          - /usr/local/bin/traefik
          - version
      register: traefik_version_output
      changed_when: false

    - name: Traefik Version anzeigen
      ansible.builtin.debug:
        var: traefik_version_output.stdout

    - name: Traefik Konfig anlegen
      ansible.builtin.file:
        path: /etc/traefik/traefik.yml
        mode: "0640"
        owner: root
        group: traefik
        state: touch
    - name: Template übertragen
      ansible.builtin.template:
        dest: /etc/traefik/traefik.yml
        src: ./templates/traefik.j2
        mode: "0640"
        owner: root
        group: traefik

    - name: traefik dienst einrichten
      ansible.builtin.template:
        src: ./templates/traefik_service.j2
        dest: /etc/systemd/system/traefik.service
        owner: root
        group: root
        mode: "0644"

    - name: systemd neuladen
      ansible.builtin.systemd_service:
        daemon_reload: true
    - name: Traekfi aktivieren und starten
      ansible.builtin.systemd_service:
        name: traefik
        state: started
        enabled: true
